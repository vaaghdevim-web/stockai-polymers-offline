apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockai-backend-hpa
  namespace: stockai-prod
  labels:
    app.kubernetes.io/name: stockai-backend
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockai-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
