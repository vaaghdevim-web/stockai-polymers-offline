apiVersion: v1
kind: ConfigMap
metadata:
  name: stockai-config
  namespace: stockai-prod
  labels:
    app.kubernetes.io/name: stockai
    environment: production
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  DB_HOST: "postgres-service.stockai-prod.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "stockai"
  DB_USERNAME: "stockai_app_user"
  DB_POOL_MAX_SIZE: "20"
  DB_POOL_MIN_IDLE: "10"
  DB_POOL_CONNECTION_TIMEOUT: "30000"
  JPA_SHOW_SQL: "false"
  REDIS_HOST: "redis-service.stockai-prod.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_ACTIVE_MACHINE_TTL: "10s"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.stockai-prod.svc.cluster.local:9092"
  STORAGE_BASE_PATH: "/app/storage"
  S3_BUCKET_NAME: "svp-stockai-documents-prod"
  CORS_ALLOWED_ORIGINS: "https://stockai.svpgroup.com"
