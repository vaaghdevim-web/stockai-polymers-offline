events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Information Leakage Prevention: Remove Nginx version and server banner
    server_tokens off;

    # Global Request Body Limits & Connection Timeouts
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Map device ID header or fallback to client IP for per-device rate limiting (avoids NAT bottleneck)
    map $http_x_device_id $rate_limit_key {
        default $binary_remote_addr;
        "~.+"   $http_x_device_id;
    }

    # Rate Limiting & Connection Limiting Zones
    limit_req_zone $rate_limit_key zone=api_rate_limit:20m rate=100r/s;
    limit_req_zone $rate_limit_key zone=iot_rate_limit:20m rate=500r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_conn_zone $rate_limit_key zone=addr_conn_limit:10m;

    upstream stockai_backend {
        server stockai-app:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================================================
    # HTTP Listener: Enforces Strict HTTP -> HTTPS Redirection
    # ==========================================================================
    server {
        listen 80;
        server_name localhost _;

        # Permit Let's Encrypt / ACME challenges without redirect
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to secure HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS Listener: Production TLSv1.2 & TLSv1.3 Secure Server Block
    # ==========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # TLS Certificates & Security Configuration
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Gzip Compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;

        # Connection Limit
        limit_conn addr_conn_limit 30;

        # Comprehensive Security Headers (HSTS applied strictly over HTTPS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;

        # High-Throughput Industrial IoT Telemetry Ingestion
        location /api/v1/iot/ {
            limit_req zone=iot_rate_limit burst=200 nodelay;

            proxy_pass http://stockai_backend/api/v1/iot/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Device-Id $http_x_device_id;
            proxy_set_header X-Device-Key $http_x_device_key;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Document & COA Uploads (Permit up to 25MB payloads)
        location /api/v1/documents/ {
            client_max_body_size 25m;
            limit_req zone=api_rate_limit burst=30 nodelay;

            proxy_pass http://stockai_backend/api/v1/documents/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Auth Login Endpoint Rate Limiting (Brute-force protection: max 10 requests/minute)
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://stockai_backend/api/v1/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Standard REST API Gateway Route
        location / {
            limit_req zone=api_rate_limit burst=50 nodelay;

            proxy_pass http://stockai_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
