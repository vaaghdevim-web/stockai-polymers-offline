# ==============================================================================
# StockAI Standalone Local / Postman Testing Profile
# ==============================================================================
spring.application.name=stockai
server.port=8080

# In-Memory PostgreSQL-Compatible H2 Database
spring.datasource.url=jdbc:h2:mem:stockai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cache and messaging offline fallbacks
spring.cache.type=none
stockai.kafka.enabled=false
stockai.minio.enabled=false

# Seed factory master data & users on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed_factory_master_data.sql
spring.sql.init.continue-on-error=false

# Security
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000
stockai.iot.device-key=STOCKAI-EDGE-DEVICE-KEY-2026
stockai.security.mfa.enforced=false
