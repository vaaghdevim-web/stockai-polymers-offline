spring.application.name=stockai

# ==============================================================================
# PostgreSQL Connection Settings
# ==============================================================================
# Database credentials and location configured via environment variables.
# Format: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockai}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# HikariCP Connection Pool Configuration (Production Baseline)
# ==============================================================================
# Pool Name: Explicit name for metrics, logs, and monitoring visibility.
spring.datasource.hikari.pool-name=StockAiHikariPool

# Maximum Pool Size (default: 20):
# Provides sufficient concurrency for manufacturing backend and telemetry ingestion
# while preventing connection exhaustion on the PostgreSQL server.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}

# Minimum Idle (default: 10):
# Maintains warm connections ready to handle initial traffic bursts without cold-start latency.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}

# Connection Timeout in ms (default: 5000 / 5 seconds):
# Maximum wait time for a thread to acquire a connection before throwing SQLException (prevents thread hanging).
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:5000}

# Idle Timeout in ms (default: 600000 / 10 minutes):
# Maximum time an idle connection above minimum-idle is allowed to remain in the pool before retirement.
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}

# Max Lifetime in ms (default: 1800000 / 30 minutes):
# Maximum lifetime of a connection in the pool to avoid stale network connections and memory leaks.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# Leak Detection Threshold in ms (15000 / 15 seconds):
# Detects long-running queries or unclosed connections holding pool slots.
spring.datasource.hikari.leak-detection-threshold=15000

# Keepalive time in ms (30000 / 30 seconds):
# Actively keeps database sockets alive to prevent firewall or gateway TCP half-close.
spring.datasource.hikari.keepalive-time=30000

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
# ddl-auto is strictly set to 'validate' to enforce that the existing database
# schema is the source of truth and is never altered or recreated.
spring.jpa.hibernate.ddl-auto=validate

# Open Session in View disabled to avoid lazy-loading issues outside transaction boundaries.
spring.jpa.open-in-view=false

# SQL Logging (off by default for production, toggle via JPA_SHOW_SQL)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Timezone standard (UTC)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================================================================
# Security & JWT Configuration
# ==============================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Active-machine reads are cached in Redis. Connection details remain externalised
# so local development and deployment use their respective Redis instances.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.redis.time-to-live=${REDIS_ACTIVE_MACHINE_TTL:5s}

# IoT Device Pre-Shared Key (Configured via environment variable)
stockai.iot.device-key=${IOT_DEVICE_KEY:}

# Multi-Factor Authentication Enforcement
stockai.security.mfa.enforced=${MFA_ENFORCED:false}

# CORS Allowed Origin Whitelist
stockai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5176,https://stockai.svpgroup.com}

# ==============================================================================
# Management & Actuator Security Hardening
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ==============================================================================
# Apache Kafka Messaging Layer (StockAI X)
# ==============================================================================
stockai.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ==============================================================================
# MinIO / S3 Object Storage & Document Service (StockAI X)
# ==============================================================================
stockai.storage.s3.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
stockai.storage.s3.access-key=${MINIO_ACCESS_KEY:}
stockai.storage.s3.secret-key=${MINIO_SECRET_KEY:}
stockai.storage.s3.bucket=${S3_BUCKET_NAME:stockai-documents}
stockai.storage.s3.region=${S3_REGION:us-east-1}
