spring.datasource.url=jdbc:h2:mem:stockai_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.sql.init.mode=never
spring.cache.type=none

# Security Test Baseline Keys
jwt.secret=SVP_STOCKAI_SUPER_SECRET_KEY_FOR_JWT_SECURITY_2026_PRODUCTION_OVERRIDE_KEY
jwt.expiration-ms=3600000
stockai.iot.device-key=STOCKAI-EDGE-DEVICE-KEY-2026
stockai.security.mfa.enforced=false
