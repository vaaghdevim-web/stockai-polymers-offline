spring.datasource.url=jdbc:h2:mem:stockai_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.sql.init.mode=never
spring.cache.type=none

# Security Test Baseline Keys
jwt.secret=TEST_ONLY_JWT_SECRET_DO_NOT_USE_IN_PRODUCTION
jwt.expiration-ms=3600000
stockai.iot.device-key=TEST_ONLY_IOT_DEVICE_KEY
stockai.security.mfa.enforced=false

IOT_DEVICE_SALT=test-only-iot-salt-for-unit-tests
IOT_DEVICE_KEY=test-only-ext01-device-key-for-unit-tests

