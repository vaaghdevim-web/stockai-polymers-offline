name: StockAI Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # 1. Quality & Automated Regression Test Suite
  # ============================================================================
  test:
    name: Unit & Integration Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Execute Test Suite
        run: ./mvnw clean test

  # ============================================================================
  # 2. Static Application Security Testing (SAST via GitHub CodeQL)
  # ============================================================================
  sast:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Application Bytecode
        run: |
          chmod +x ./mvnw
          ./mvnw compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  # ============================================================================
  # 3. Secret & Credential Leak Scanning (TruffleHog)
  # ============================================================================
  secret-scan:
    name: Secret & Credential Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ============================================================================
  # 4. Dependency Vulnerability & SCA Scanning (Trivy SCA & SBOM)
  # ============================================================================
  dependency-scan:
    name: Software Composition Analysis (SCA) & SBOM
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: |
          mkdir -p target
          trivy fs --format cyclonedx --output target/stockai-sbom.json .

      - name: Run Trivy Dependency Vulnerability Scanner (Blocking Gate)
        run: |
          trivy fs --format table --severity CRITICAL,HIGH --exit-code 1 .

      - name: Archive SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockai-sbom-${{ github.sha }}
          path: target/stockai-sbom.json
          retention-days: 30

  # ============================================================================
  # 5. Container Image Build & Vulnerability Scanning
  # ============================================================================
  container-scan:
    name: Container Build & Image Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: stockai-backend:${{ github.sha }}

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan Container Image with Trivy (Blocking Gate)
        run: |
          trivy image --format table --severity CRITICAL,HIGH --exit-code 1 stockai-backend:${{ github.sha }}

  # ============================================================================
  # 6. Immutable Artifact Packaging & SHA-256 Provenance Checksum
  # ============================================================================
  package-and-checksum:
    name: Package Release Artifact & Integrity Checksum
    runs-on: ubuntu-latest
    needs: [test, sast, secret-scan, dependency-scan, container-scan]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package Application JAR
        run: |
          chmod +x ./mvnw
          ./mvnw package -DskipTests

      - name: Generate SHA-256 Checksum
        run: |
          cd target
          sha256sum stockai-*.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Archive Production Release Artifact & Checksum
        uses: actions/upload-artifact@v4
        with:
          name: stockai-release-${{ github.sha }}
          path: |
            target/stockai-*.jar
            target/SHA256SUMS
          retention-days: 30
