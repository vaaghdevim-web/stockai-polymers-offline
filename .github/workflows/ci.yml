name: StockAI Enterprise CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  backend-test:
    name: Backend Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: backend

      - name: Run backend verification
        run: ./mvnw clean verify
        working-directory: backend

  frontend-test:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-scan:
    name: Dependency SCA & SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          trivy fs \
            --format cyclonedx \
            --output artifacts/stockai-sbom.json \
            .

      - name: Run HIGH/CRITICAL dependency scan
        run: |
          trivy fs \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            .

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: stockai-sbom-${{ github.sha }}
          path: artifacts/stockai-sbom.json
          retention-days: 30

  container-scan:
    name: Container Build & CVE Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: stockai-backend:${{ github.sha }}

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Scan container image
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            stockai-backend:${{ github.sha }}

  package-release:
    name: Package Release Artifact
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test
      - secret-scan
      - dependency-scan
      - container-scan

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: backend

      - name: Package backend JAR
        run: ./mvnw package -DskipTests
        working-directory: backend

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd backend/target
          sha256sum stockai-*.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockai-release-${{ github.sha }}
          path: |
            backend/target/stockai-*.jar
            backend/target/SHA256SUMS
          retention-days: 30