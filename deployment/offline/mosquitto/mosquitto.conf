# StockAI Offline Factory MQTT Broker
# Credentials are supplied through /mosquitto/config/passwd
# Do NOT enable anonymous MQTT access in production.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

autosave_interval 30

log_dest stdout
connection_messages true
log_timestamp true

max_inflight_messages 100
max_queued_messages 1000
